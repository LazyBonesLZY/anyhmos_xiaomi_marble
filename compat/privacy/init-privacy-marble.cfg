{
    "jobs": [
        {
            "name": "marble-super-privacy-dirs",
            "cmds": [
                "mkdir /data/service/el1/public/super_privacy 0771 super_privacy_server super_privacy_server"
            ]
        },
        {
            "name": "marble-security-privacy-dirs",
            "cmds": [
                "mkdir /data/service/el1/public/database 0711 ddms ddms",
                "mkdir /data/service/el1/public/database/gtoken_policy 02770 security_privacy_server ddms"
            ]
        }
    ],
    "services": [
        {
            "name": "privacy_service",
            "path": [
                "/system/bin/sa_main",
                "/system/profile/privacy_service.json"
            ],
            "critical": [
                1,
                4,
                240
            ],
            "importance": -20,
            "uid": "access_token",
            "gid": [
                "access_token"
            ],
            "permission": [
                "ohos.permission.GET_RUNNING_INFO",
                "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
                "ohos.permission.GET_SENSITIVE_PERMISSIONS",
                "ohos.permission.MANAGE_DISPOSED_APP_STATUS",
                "ohos.permission.MICROPHONE",
                "ohos.permission.RUNNING_STATE_OBSERVER",
                "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
                "ohos.permission.CAMERA_CONTROL",
                "ohos.permission.MICROPHONE_CONTROL",
                "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
                "ohos.permission.SET_SUPER_PRIVACY",
                "ohos.permission.PERMISSION_RECORD_TOGGLE",
                "ohos.permission.USE_SECURITY_PRIVACY_MESSAGER",
                "ohos.permission.MANAGE_SECURE_SETTINGS",
                "ohos.permission.PERMISSION_USED_STATS",
                "ohos.permission.ACCESS_SECURITY_PRIVACY_CENTER",
                "ohos.permission.START_SYSTEM_DIALOG",
                "ohos.permission.START_ABILITIES_FROM_BACKGROUND"
            ],
            "permission_acls": [
                "ohos.permission.MANAGE_DISPOSED_APP_STATUS",
                "ohos.permission.PERMISSION_RECORD_TOGGLE",
                "ohos.permission.USE_SECURITY_PRIVACY_MESSAGER",
                "ohos.permission.CAMERA_CONTROL",
                "ohos.permission.MICROPHONE_CONTROL",
                "ohos.permission.SET_SUPER_PRIVACY"
            ],
            "secon": "u:r:privacy_service:s0",
            "disabled": 1,
            "once": 1,
            "start-mode": "condition",
            "sandbox": 0,
            "saspawn": false
        },
        {
            "name": "super_privacy_server",
            "path": [
                "/system/bin/sa_main",
                "/system/profile/super_privacy_server.json"
            ],
            "uid": "super_privacy_server",
            "gid": [
                "super_privacy_server",
                "shell"
            ],
            "ondemand": true,
            "apl": "system_basic",
            "permission": [
                "ohos.permission.MANAGE_AUDIO_CONFIG",
                "ohos.permission.MICROPHONE_CONTROL",
                "ohos.permission.MANAGE_CAMERA_CONFIG",
                "ohos.permission.CAMERA_CONTROL",
                "ohos.permission.MANAGE_SECURE_SETTINGS",
                "ohos.permission.MANAGE_SETTINGS",
                "ohos.permission.RECEIVER_STARTUP_COMPLETED",
                "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
                "ohos.permission.CONTROL_LOCATION_SWITCH",
                "ohos.permission.ACCESS_SYSTEM_SETTINGS",
                "ohos.permission.ACCESS_SECURITY_PRIVACY_CENTER",
                "ohos.permission.START_ABILITIES_FROM_BACKGROUND"
            ],
            "permission_acls": [
                "ohos.permission.MICROPHONE_CONTROL",
                "ohos.permission.CAMERA_CONTROL",
                "ohos.permission.CONTROL_LOCATION_SWITCH"
            ],
            "secon": "u:r:super_privacy_server:s0",
            "jobs": {
                "on-start": "marble-super-privacy-dirs"
            }
        },
        {
            "name": "security_privacy_server",
            "path": [
                "/system/bin/sa_main",
                "/system/profile/security_privacy_server.json"
            ],
            "uid": "security_privacy_server",
            "gid": [
                "security_privacy_server",
                "shell"
            ],
            "ondemand": true,
            "apl": "system_basic",
            "permission": [
                "ohos.permission.GET_SENSITIVE_PERMISSIONS",
                "ohos.permission.GRANT_SENSITIVE_PERMISSIONS",
                "ohos.permission.REVOKE_SENSITIVE_PERMISSIONS",
                "ohos.permission.USE_SECURITY_PRIVACY_MESSAGER",
                "ohos.permission.PERMISSION_USED_STATS",
                "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
                "ohos.permission.GET_INSTALLED_BUNDLE_LIST",
                "ohos.permission.MANAGE_DISPOSED_APP_STATUS",
                "ohos.permission.RECEIVER_STARTUP_COMPLETED",
                "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
                "ohos.permission.START_RESTORE_NOTIFICATION",
                "ohos.permission.MANAGE_SETTINGS",
                "ohos.permission.ACCESS_SECURITY_PRIVACY_CENTER",
                "ohos.permission.RECEIVE_BMS_BROKER_MESSAGES",
                "ohos.permission.MANAGE_SECURE_SETTINGS",
                "ohos.permission.START_ABILITIES_FROM_BACKGROUND",
                "ohos.permission.REPORT_SECURITY_EVENT"
            ],
            "permission_acls": [
                "ohos.permission.GRANT_SENSITIVE_PERMISSIONS",
                "ohos.permission.REVOKE_SENSITIVE_PERMISSIONS",
                "ohos.permission.USE_SECURITY_PRIVACY_MESSAGER",
                "ohos.permission.MANAGE_DISPOSED_APP_STATUS"
            ],
            "jobs": {
                "on-start": "marble-security-privacy-dirs"
            },
            "secon": "u:r:security_privacy_server:s0"
        }
    ]
}
