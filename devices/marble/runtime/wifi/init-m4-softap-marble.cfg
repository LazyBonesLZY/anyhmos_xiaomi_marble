{
  "jobs": [
    {
      "name": "marble-softap-dirs",
      "cmds": [
        "mkdir /data/service/el1/public/wifi 0770 wifi wifi_group",
        "mkdir /data/service/el1/public/wifi/wpa_supplicant 0770 wifi wifi_group",
        "mkdir /data/service/el1/public/wifi/sockets 0770 wifi wifi_group",
        "mkdir /data/service/el1/public/wifi/sockets/wpa 0770 wifi wifi_group",
        "mkdir /data/service/el1/public/dhcp 0770 dhcp dhcp"
      ]
    },
    {
      "name": "param:marble-softap-ready",
      "condition": "marble.softap.ready=true",
      "cmds": [
        "trigger marble-softap-dirs",
        "start hostapd_host"
      ]
    }
  ],
  "services": [
    {
      "name": "hostapd_host",
      "ondemand": true,
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "16",
        "-n",
        "hostapd_host"
      ],
      "uid": "wifi",
      "gid": [
        "wifi",
        "wifi_group",
        "wifi_host"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH",
        "NET_ADMIN",
        "NET_RAW"
      ],
      "secon": "u:r:wifi_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
