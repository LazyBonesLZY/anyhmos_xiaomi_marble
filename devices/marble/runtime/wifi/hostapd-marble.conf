# Xiaomi marble (QCA6490 / cfg80211 nl80211) default SoftAP template.
# Seeded to /data/service/el1/public/wifi/wpa_supplicant/hostapd.conf when absent.
# wifi_manager_service overrides SSID/channel/band/WPA2 keys dynamically via
# hostapd_interface_service control commands.

interface=wlan0
driver=nl80211
ctrl_interface=/data/service/el1/public/wifi/sockets/wpa
ssid=HarmonyOS_Marble
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
ignore_broadcast_ssid=0
max_num_sta=10
