{
  "jobs": [
    {
      "name": "post-fs-data",
      "cmds": [
        "mkdir /data/local/tmp/marble-codec 0775 codec_host graphics",
        "mkdir /data/service/el1/public/displayengine 0770 display_engine_service graphics",
        "chown display_engine_service graphics /data/service/el1/public/displayengine",
        "chmod 0770 /data/service/el1/public/displayengine"
      ]
    },
    {
      "name": "param:marble-u3-media",
      "condition": "marble.debug.start.u3_media=true",
      "cmds": [
        "mkdir /data/local/tmp/marble-codec 0775 codec_host graphics",
        "mkdir /data/service/el1/public/displayengine 0770 display_engine_service graphics",
        "chown display_engine_service graphics /data/service/el1/public/displayengine",
        "chmod 0770 /data/service/el1/public/displayengine",
        "start codec_host",
        "start display_engine_service"
      ]
    }
  ],
  "services": [
    {
      "name": "codec_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "8",
        "-n",
        "codec_host"
      ],
      "uid": "codec_host",
      "gid": [
        "codec_host",
        "vcodec",
        "dev_dma_heap",
        "graphics"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:codec_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    },
    {
      "name": "display_engine_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/display_engine_service.json"
      ],
      "uid": "display_engine_service",
      "gid": [
        "servicectrl",
        "system",
        "graphics",
        "dfs"
      ],
      "apl": "system_basic",
      "secon": "u:r:display_engine_service:s0",
      "permission": [
        "ohos.permission.RECEIVER_STARTUP_COMPLETED",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.PARENT_CONTROL_SERVICE",
        "ohos.permission.ACTIVITY_MOTION"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
