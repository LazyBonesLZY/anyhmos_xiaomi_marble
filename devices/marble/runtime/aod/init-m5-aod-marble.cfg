{
  "jobs": [
    {
      "name": "param:marble-aod-start",
      "condition": "marble.debug.start.aod=true",
      "cmds": [
        "start aod_service"
      ]
    },
    {
      "name": "param:marble-aod-stop",
      "condition": "marble.debug.start.aod=false",
      "cmds": [
        "stop aod_service"
      ]
    }
  ],
  "services": [
    {
      "name": "aod_service",
      "path": [
        "/system/bin/sa_main",
        "/compat/etc/aod-marble.json"
      ],
      "uid": "aod",
      "gid": [
        "dev_dma_heap",
        "aod",
        "tp_host",
        "wallpaper"
      ],
      "secon": "u:r:aod_service:s0",
      "permission": [
        "ohos.permission.INJECT_INPUT_EVENT"
      ],
      "permission_acls": [
        "ohos.permission.INJECT_INPUT_EVENT"
      ],
      "disabled": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
