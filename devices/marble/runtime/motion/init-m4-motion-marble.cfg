{
  "jobs": [
    {
      "name": "param:marble-motion-ready",
      "condition": "marble.motion.ready=true",
      "cmds": [
        "start motion_host"
      ]
    }
  ],
  "services": [
    {
      "name": "motion_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "18",
        "-n",
        "motion_host"
      ],
      "uid": "motion_host",
      "gid": [
        "motion_host",
        "composer_host",
        "dev_lcd_backlight",
        "sensor_host",
        "system"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:motion_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
