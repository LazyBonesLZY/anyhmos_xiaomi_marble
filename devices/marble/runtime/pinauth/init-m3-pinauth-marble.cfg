{
  "jobs": [
    {
      "name": "param:marble-pinauth-ready",
      "condition": "marble.pinauth.ready=true",
      "cmds": [
        "mkdir /data/service/el1/public/pinauth 0700 useriam useriam",
        "start pin_auth_host"
      ]
    }
  ],
  "services": [
    {
      "name": "pin_auth_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "17",
        "-n",
        "pin_auth_host"
      ],
      "uid": "useriam",
      "gid": [
        "useriam",
        "uhdf_driver"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:pin_auth_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
