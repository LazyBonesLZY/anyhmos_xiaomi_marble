{
  "jobs": [
    {
      "name": "param:marble-m6-codesign",
      "condition": "marble.debug.start.codesign=true",
      "cmds": [
        "write /proc/sys/fs/verity/require_signatures 1",
        "write /proc/sys/fs/verity/developer_mode 1",
        "mkdir /data/service/el1/public/profiles 0755 installs installs",
        "mkdir /data/service/el1/public/profiles/release 0755 installs installs",
        "mkdir /data/service/el1/public/profiles/debug 0755 installs installs",
        "start key_enable"
      ]
    },
    {
      "name": "param:marble-m6-devmode-on",
      "condition": "const.security.developermode.state=true",
      "cmds": [
        "write /proc/sys/fs/verity/developer_mode 1"
      ]
    },
    {
      "name": "param:marble-m6-devmode-off",
      "condition": "const.security.developermode.state=false",
      "cmds": [
        "write /proc/sys/fs/verity/developer_mode 0"
      ]
    }
  ],
  "services": [
    {
      "name": "key_enable",
      "path": [
        "/system/bin/key_enable"
      ],
      "importance": -20,
      "uid": "root",
      "gid": [
        "root"
      ],
      "caps": [
        "SYS_ADMIN",
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:key_enable:s0",
      "sandbox": 0,
      "saspawn": false,
      "disabled": 1,
      "start-mode": "condition",
      "once": 1
    },
    {
      "name": "local_code_sign",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/local_code_sign.json"
      ],
      "uid": "code_sign",
      "gid": [
        "code_sign"
      ],
      "secon": "u:r:local_code_sign:s0",
      "permission": [
        "ohos.permission.ATTEST_KEY",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED"
      ],
      "ondemand": true,
      "once": 1,
      "apl": "system_basic"
    }
  ]
}
