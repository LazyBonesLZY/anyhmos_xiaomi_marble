{
  "jobs": [
    {
      "name": "param:marble-thermal-ready",
      "condition": "marble.thermal.ready=true",
      "cmds": [
        "start thermal_host"
      ]
    }
  ],
  "services": [
    {
      "name": "thermal_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "11",
        "-n",
        "thermal_host"
      ],
      "uid": "power_host",
      "gid": [
        "power_host",
        "powerctrl",
        "system"
      ],
      "caps": [
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:power_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
