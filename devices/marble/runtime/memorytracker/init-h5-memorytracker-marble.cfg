{
  "jobs": [
    {
      "name": "param:marble-memorytracker-ready",
      "condition": "marble.memorytracker.ready=true",
      "cmds": [
        "start memorytracker_host"
      ]
    }
  ],
  "services": [
    {
      "name": "memorytracker_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "14",
        "-n",
        "memorytracker_host"
      ],
      "uid": "memmgr",
      "gid": [
        "memmgr",
        "system"
      ],
      "caps": [
        "DAC_READ_SEARCH",
        "SYS_PTRACE"
      ],
      "secon": "u:r:memmgrservice:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
