{
  "jobs": [
    {
      "name": "post-fs-data",
      "cmds": [
        "mknod /dev/uinput c 10 223",
        "chmod 0600 /dev/uinput",
        "chown root root /dev/uinput",
        "start marble_touch_wakeup"
      ]
    },
    {
      "name": "param:marble-touch-wakeup-ready",
      "condition": "marble.touch_wakeup.ready=true",
      "cmds": [
        "mknod /dev/uinput c 10 223",
        "chmod 0600 /dev/uinput",
        "chown root root /dev/uinput",
        "start marble_touch_wakeup"
      ]
    }
  ],
  "services": [
    {
      "name": "marble_touch_wakeup",
      "path": [
        "/compat/bin/marble_touch_wakeup",
        "--power-key",
        "--only-when-off"
      ],
      "uid": "root",
      "gid": [
        "root",
        "system"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH",
        "MKNOD",
        "CHOWN",
        "FOWNER"
      ],
      "secon": "u:r:init:s0",
      "disabled": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
