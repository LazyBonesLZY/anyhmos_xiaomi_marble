{
  "jobs": [
    {
      "name": "param:marble-vibrator-ready",
      "condition": "marble.vibrator.ready=true",
      "cmds": [
        "start vibrator_host"
      ]
    }
  ],
  "services": [
    {
      "name": "vibrator_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "15",
        "-n",
        "vibrator_host"
      ],
      "uid": "vibrator_host",
      "gid": [
        "vibrator_host",
        "dev_vibrator",
        "input",
        "system"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH",
        "SYS_NICE"
      ],
      "secon": "u:r:vibrator_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
