{
  "jobs": [
    {
      "name": "param:marble-power-ready",
      "condition": "marble.power.ready=true",
      "cmds": [
        "start power_host"
      ]
    }
  ],
  "services": [
    {
      "name": "power_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "12",
        "-n",
        "power_host"
      ],
      "uid": "power_host",
      "gid": [
        "power_host",
        "powerctrl",
        "system"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:power_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
