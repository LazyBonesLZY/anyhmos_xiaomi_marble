{
  "jobs": [
    {
      "name": "param:marble-mi-thermal-ready",
      "condition": "marble.mi_thermal.ready=true",
      "cmds": [
        "mkdir /data/local/tmp/hmos-mi-thermal 0755 root root",
        "mkdir /data/local/tmp/hmos-mi-thermal/root 0755 root root",
        "start marble_mi_thermald"
      ]
    }
  ],
  "services": [
    {
      "name": "marble_mi_thermald",
      "path": [
        "/compat/bin/native_thermal_launcher_marble",
        "/data/local/tmp/hmos-mi-thermal/root"
      ],
      "uid": "root",
      "gid": [
        "root",
        "system"
      ],
      "caps": [
        "SYS_CHROOT",
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition"
    }
  ]
}
