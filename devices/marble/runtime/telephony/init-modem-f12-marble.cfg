{
    "jobs": [
        {
            "name": "param:marble-f12-pre-telephony",
            "condition": "marble.debug.start.pre_telephony=true",
            "cmds": [
                "mkdir /data/service/el1/public/telephony 0711 radio radio",
                "mkdir /data/service/el2/public/telephony 0711 radio radio",
                "start hmos_ims_core_service",
                "start telephony_sa"
            ]
        },
        {
            "name": "param:marble-f12-stop-telephony",
            "condition": "marble.debug.f12.tel_phase=stop",
            "cmds": [
                "stop telephony_sa"
            ]
        },
        {
            "name": "param:marble-f12-start-telephony",
            "condition": "marble.debug.f12.tel_phase=start",
            "cmds": [
                "start telephony_sa"
            ]
        }
    ],
    "services": [
        {
            "name": "hmos_ims_core_service",
            "path": [
                "/compat/bin/hmos_ims_core_service"
            ],
            "uid": "radio",
            "gid": [
                "radio",
                "shell",
                "netsys_socket"
            ],
            "apl": "system_basic",
            "secon": "u:r:telephony_sa:s0",
            "sandbox": 0,
            "disabled": 1,
            "once": 1,
            "start-mode": "condition"
        }
    ]
}
