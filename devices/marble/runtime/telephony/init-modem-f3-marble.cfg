{
    "jobs": [
        {
            "name": "param:marble-gnss-f3",
            "condition": "marble.debug.start.gnss=true",
            "cmds": [
                "mkdir /data/local/tmp/gnss-hdi 0775 gps gps",
                "start gnss_hdi_marble"
            ]
        }
    ],
    "services": [
        {
            "name": "gnss_hdi_marble",
            "path": [
                "/compat/bin/native_gnss_hdi_publisher",
                "--serve"
            ],
            "uid": "gps",
            "gid": [
                "gps",
                "system",
                "radio"
            ],
            "secon": "u:r:location_host:s0",
            "disabled": 1,
            "once": 1,
            "sandbox": 0,
            "start-mode": "condition"
        }
    ]
}
