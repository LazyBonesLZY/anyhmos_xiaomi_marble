{
  "jobs": [
    {
      "name": "post-fs-data",
      "cmds": [
        "mkdir /data/local/tmp/gnss-hdi 0775 location_host gps"
      ]
    }
  ],
  "services": [
    {
      "name": "location_host",
      "ondemand": true,
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "7",
        "-n",
        "location_host"
      ],
      "uid": "location_host",
      "gid": [
        "location_host",
        "system",
        "gps",
        "radio"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:location_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
