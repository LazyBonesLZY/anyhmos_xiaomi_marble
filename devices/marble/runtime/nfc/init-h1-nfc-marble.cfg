{
  "jobs": [
    {
      "name": "marble-nfc-dirs",
      "cmds": [
        "mkdir /data/nfc 0770 nfc nfc",
        "mkdir /data/log/nfc 0770 nfc_host nfc_host"
      ]
    },
    {
      "name": "param:marble-nfc-ready",
      "condition": "marble.nfc.ready=true",
      "cmds": [
        "trigger marble-nfc-dirs",
        "start nfc_host"
      ]
    }
  ],
  "services": [
    {
      "name": "nfc_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "10",
        "-n",
        "nfc_host"
      ],
      "uid": "nfc_host",
      "gid": [
        "nfc_host",
        "nfc",
        "system"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:nfc_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
