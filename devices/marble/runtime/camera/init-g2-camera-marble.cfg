{
  "jobs": [
    {
      "name": "marble-camera-dirs",
      "cmds": [
        "mkdir /data/service/el1/public/camera_service 0760 cameraserver cameraserver",
        "mkdir /data/service/el1/public/camera_service/cache 0760 cameraserver cameraserver",
        "mkdir /data/service/el1/public/camera_service/network_resource 0765 cameraserver cameraserver",
        "mkdir /data/vendor/camera 0775 camera_host dev_camera"
      ]
    },
    {
      "name": "param:marble-camera-ready",
      "condition": "marble.camera.ready=true",
      "cmds": [
        "trigger marble-camera-dirs",
        "start camera_host",
        "start camera_service"
      ]
    }
  ],
  "services": [
    {
      "name": "camera_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "9",
        "-n",
        "camera_host"
      ],
      "uid": "camera_host",
      "gid": [
        "camera_host",
        "dev_camera",
        "media",
        "graphics",
        "dev_dma_heap",
        "system"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:camera_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    },
    {
      "name": "camera_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/camera_service.json"
      ],
      "uid": "cameraserver",
      "gid": [
        "user_data_rw",
        "system",
        "shell",
        "access_token",
        "netsys_socket"
      ],
      "secon": "u:r:camera_service:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition",
      "jobs": {
        "on-start": "marble-camera-dirs"
      },
      "permission": [
        "ohos.permission.GET_SENSITIVE_PERMISSIONS",
        "ohos.permission.PERMISSION_USED_STATS",
        "ohos.permission.ACCESS_SERVICE_DM",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.READ_IMAGEVIDEO",
        "ohos.permission.WRITE_IMAGEVIDEO",
        "ohos.permission.MICROPHONE",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.SET_MUTE_POLICY",
        "ohos.permission.RECEIVE_UPDATE_MESSAGE",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.MANAGE_CAMERA_CONFIG",
        "ohos.permission.GET_SUSPEND_STATE",
        "ohos.permission.GET_PERMISSION_POLICY",
        "ohos.permission.INTERNET",
        "ohos.permission.CLOUD_ROM_UPDATE",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.STORAGE_MANAGER",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.MODIFY_AUDIO_SETTINGS",
        "ohos.permission.ACTIVITY_MOTION"
      ],
      "permission_acls": [
        "ohos.permission.GET_SENSITIVE_PERMISSIONS",
        "ohos.permission.SET_MUTE_POLICY",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT"
      ]
    }
  ]
}
