{
  "jobs": [
    {
      "name": "services:huawei_id_svc",
      "cmds": [
        "mkdir /data/service/el1/public/huaweiid/ 0710 huawei_id system",
        "mkdir /data/service/el1/public/huaweiid/files 0770 huawei_id system",
        "mkdir /data/service/el1/public/huaweiid/files/httpdns 0770 huawei_id system",
        "mkdir /data/service/el1/public/huaweiid/files/cccs_grs 0770 huawei_id huawei_id",
        "mkdir /data/service/el1/public/huaweiid/files/cccs_grs/config 0770 huawei_id huawei_id",
        "mkdir /data/service/el1/public/huaweiid/files/cccs_grs/router 0770 huawei_id huawei_id"
      ]
    },
    {
      "name": "services:client_cloud_cache_service_start",
      "cmds": [
        "mkdir /data/service/el1/public/client_cloud_cache_service 0700 cccs cccs",
        "mkdir /data/service/el1/public/client_cloud_cache_service/cache 0700 cccs cccs"
      ]
    },
    {
      "name": "services:index_insert_service",
      "cmds": [
        "mkdir /data/service/el1/public/file_monitor_service 0700 user_data_rw user_data_rw",
        "mkdir /data/service/el2/public/file_monitor_service 0777 user_data_rw user_data_rw",
        "mkdir /data/service/el2/public/file_monitor_service/database 0700 user_data_rw user_data_rw",
        "mkdir /data/service/el2/public/file_monitor_service/content_share 0777 user_data_rw user_data_rw",
        "mkdir /data/service/el2/public/file_monitor_service/content_share/content_files 0777 user_data_rw user_data_rw",
        "mkdir /data/service/el2/public/file_monitor_service/content_share/fusion 0777 user_data_rw user_data_rw",
        "mkdir /data/service/el2/public/file_monitor_service/content_share/consistency_check 0777 user_data_rw user_data_rw"
      ]
    },
    {
      "name": "param:marble-b2-apps",
      "condition": "marble.debug.start.b2_apps=true",
      "cmds": [
        "start huawei_id_svc",
        "start client_cloud_cache_service",
        "start index_insert_service"
      ]
    }
  ],
  "services": [
    {
      "name": "huawei_id_svc",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/huawei_id_svc.json"
      ],
      "ondemand": true,
      "uid": "huawei_id",
      "gid": [
        "huawei_id",
        "netsys_socket"
      ],
      "apl": "system_basic",
      "jobs": {
        "on-start": "services:huawei_id_svc"
      },
      "permission": [
        "ohos.permission.MANAGE_DISTRIBUTED_ACCOUNTS",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.GET_TELEPHONY_STATE",
        "ohos.permission.WRITE_ACCOUNT_LOGIN_STATE",
        "ohos.permission.GET_PHONE_NUMBERS",
        "ohos.permission.START_SYSTEM_DIALOG",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.GET_WIFI_INFO",
        "ohos.permission.ACCESS_USER_AUTH_INTERNAL",
        "ohos.permission.USE_USER_IDM",
        "ohos.permission.ACCESS_HIVIEWCARE",
        "ohos.permission.ACCESS_FUSION_MANAGER",
        "ohos.permission.ACCESS_PROTOCOL_DFX_STATE",
        "ohos.permission.ACCESS_LOWPOWER_MANAGER",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.PARENT_CONTROL_SERVICE",
        "ohos.permission.OBSERVE_FORM_RUNNING",
        "ohos.permission.SUBSCRIBE_SWING_ABILITY"
      ],
      "start-mode": "condition",
      "secon": "u:r:huaweiid_service:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false
    },
    {
      "name": "client_cloud_cache_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/client_cloud_cache_service.json"
      ],
      "ondemand": true,
      "uid": "cccs",
      "gid": [
        "cccs",
        "system",
        "shell",
        "netsys_socket"
      ],
      "jobs": {
        "on-start": "services:client_cloud_cache_service_start"
      },
      "permission": [
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.READ_DFX_SYSEVENT",
        "ohos.permission.GET_BUNDLE_RESOURCES",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.INTERNET",
        "ohos.permission.MANAGE_USER_ACCOUNT_INFO",
        "ohos.permission.ACCESS_USER_ACCOUNT_INFO"
      ],
      "permission_acls": [
        "ohos.permission.MANAGE_USER_ACCOUNT_INFO"
      ],
      "start-mode": "condition",
      "secon": "u:r:cccs:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false
    },
    {
      "name": "index_insert_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/index_insert_service.json"
      ],
      "ondemand": true,
      "uid": "user_data_rw",
      "gid": [
        "user_data_rw",
        "file_manager",
        "log"
      ],
      "jobs": {
        "on-start": "services:index_insert_service"
      },
      "caps": [
        "CAP_SYS_ADMIN",
        "CAP_DAC_READ_SEARCH"
      ],
      "permission": [
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.ACCESS_FILE_CONTENT_SHARE",
        "ohos.permission.ACCESS_AI_ABILITY",
        "ohos.permission.STORAGE_MANAGER",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.MANAGE_VOLUME_ENCRYPTION_POLICY"
      ],
      "secon": "u:r:file_monitor_service:s0",
      "sandbox": 0
    }
  ]
}
