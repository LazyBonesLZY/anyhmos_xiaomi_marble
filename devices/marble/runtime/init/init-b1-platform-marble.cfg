{
  "jobs": [
    {
      "name": "param:marble-b1-platform",
      "condition": "marble.debug.start.b1=true",
      "cmds": [
        "mkdir /data/service/el1/public/database 0711 ddms ddms",
        "mkdir /data/service/el1/public/database/oaid_service_manager 02770 oaid_service ddms",
        "mkdir /data/service/el2/public/oaid_service_manager 0711 oaid_service oaid_service",
        "mkdir /data/service/el2/public/oaid_service_manager/database 02770 oaid_service oaid_service",
        "mkdir /data/service/el1/public/deviceauth 0711 deviceauth deviceauth",
        "mkdir /data/service/el1/public/deviceauth/account 0711 deviceauth deviceauth",
        "mkdir /data/service/el1/public/deviceauth/pseudonym 0711 deviceauth deviceauth",
        "mkdir /data/vendor 0771 root root",
        "mkdir /data/vendor/gnss 0770 gps gps",
        "mkdir /data/service/el1/public/location 0711 gps gps",
        "mkdir /data/service/el2/public/location 0711 gps gps",
        "mkdir /data/service/el1/public/location/cccs_grs 0700 gps gps",
        "mkdir /data/service/el1/public/location/cccs_grs/router 0700 gps gps",
        "mkdir /data/service/el1/public/location/cccs_grs/cache 0700 gps gps",
        "copy /chip_prod/etc/gps/grs_app_global_route_config.json /data/service/el1/public/location/cccs_grs/router/grs_app_global_route_config.json",
        "chown gps gps /data/service/el1/public/location/cccs_grs/router/grs_app_global_route_config.json",
        "start oaid_service"
      ]
    }
  ],
  "services": [
    {
      "name": "oaid_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/oaid_service.json"
      ],
      "uid": "oaid_service",
      "gid": [
        "oaid_service",
        "shell"
      ],
      "sandbox": 0,
      "permission": [
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.PERMISSION_USED_STATS",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS"
      ],
      "secon": "u:r:oaid_service:s0",
      "ondemand": true
    },
    {
      "name": "deviceauth_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/deviceauth_service.json"
      ],
      "uid": "deviceauth",
      "gid": [
        "deviceauth",
        "shell",
        "netsys_socket"
      ],
      "sandbox": 0,
      "ondemand": true,
      "secon": "u:r:deviceauth_service:s0",
      "permission": [
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.MANAGE_DEVICE_AUTH_CRED",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.START_ABILITIES_FROM_BACKGROUND"
      ]
    },
    {
      "name": "locationhub",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/locationhub.json"
      ],
      "uid": "gps",
      "gid": [
        "gps",
        "shell",
        "netsys_socket"
      ],
      "sandbox": 0,
      "secon": "u:r:locationhub:s0",
      "permission": [
        "ohos.permission.PERMISSION_USED_STATS",
        "ohos.permission.GET_SENSITIVE_PERMISSIONS",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.GET_TELEPHONY_STATE",
        "ohos.permission.LOCATION",
        "ohos.permission.APPROXIMATELY_LOCATION",
        "ohos.permission.LOCATION_IN_BACKGROUND",
        "ohos.permission.GET_WIFI_INFO",
        "ohos.permission.GET_WIFI_LOCAL_MAC",
        "ohos.permission.GET_WIFI_PEERS_MAC",
        "ohos.permission.SET_WIFI_INFO",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.MANAGE_BLUETOOTH",
        "ohos.permission.GET_BLUETOOTH_PEERS_MAC",
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.START_SYSTEM_DIALOG",
        "ohos.permission.ACCESS_PROTOCOL_DFX_STATE",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.ACTIVITY_MOTION",
        "ohos.permission.INTERNET",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.RECEIVE_SMS",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.READ_CALL_LOG",
        "ohos.permission.ACCESS_MULTICORE_HYBRID_ABILITY",
        "ohos.permission.ACCESS_CAR_DISTRIBUTED_ENGINE",
        "ohos.permission.START_ABILITIES_FROM_BACKGROUND",
        "ohos.permission.POWER_OPTIMIZATION",
        "ohos.permission.MANAGE_CAMERA_CONFIG"
      ],
      "permission_acls": [
        "ohos.permission.GET_SENSITIVE_PERMISSIONS",
        "ohos.permission.GET_WIFI_PEERS_MAC"
      ],
      "ondemand": true
    }
  ]
}
