{
  "jobs": [
    {
      "name": "param:marble-sensors-start",
      "condition": "marble.debug.start.sensors=true",
      "cmds": [
        "mkdir /data/service/el1/public/sensor 0770 sensor sensor",
        "chown sensor sensor /data/service/el1/public/sensor",
        "start sensor_host"
      ]
    },
    {
      "name": "param:marble-sensors-stop",
      "condition": "marble.debug.start.sensors=false",
      "cmds": [
        "stop sensors",
        "stop sensor_host"
      ]
    },
    {
      "name": "param:marble-sensor-hdi-ready",
      "condition": "bootevent.hmos_sensor_hdi.ready=true && marble.debug.start.sensors=true",
      "cmds": [
        "start sensors"
      ]
    },
    {
      "name": "param:marble-sensor-hdi-stopped",
      "condition": "bootevent.hmos_sensor_hdi.ready=false",
      "cmds": [
        "stop sensors"
      ]
    }
  ],
  "services": [
    {
      "name": "sensor_host",
      "path": [
        "/compat/bin/native_sensor_hdi_publisher",
        "/compat/lib64/libsensor_interface_service_3.1.z.so",
        "--serve"
      ],
      "uid": "sensor_host",
      "gid": [
        "sensor_host",
        "oeminfo_nvme_server"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "secon": "u:r:sensor_host:s0"
    },
    {
      "name": "sensors",
      "path": [
        "/system/bin/sa_main",
        "/compat/etc/sensors-marble.json"
      ],
      "uid": "sensor",
      "gid": [
        "sensor",
        "shell"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "saspawn": false,
      "start-mode": "condition",
      "secon": "u:r:sensors:s0",
      "permission": [
        "ohos.permission.PERMISSION_USED_STATS",
        "ohos.permission.GET_SENSITIVE_PERMISSIONS",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.GET_BUNDLE_INFO",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.RECEIVE_UPDATE_MESSAGE",
        "ohos.permission.ACCESS_SECURITY_PRIVACY_CENTER",
        "ohos.permission.RECEIVER_STARTUP_COMPLETED"
      ],
      "permission_acls": [
        "ohos.permission.GET_SENSITIVE_PERMISSIONS"
      ]
    }
  ]
}
