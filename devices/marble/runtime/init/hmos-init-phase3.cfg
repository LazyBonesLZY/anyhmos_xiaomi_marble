        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.GET_SENSITIVE_PERMISSIONS",
        "ohos.permission.MANAGE_DISPOSED_APP_STATUS",
        "ohos.permission.MICROPHONE",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.CAMERA_CONTROL",
        "ohos.permission.MICROPHONE_CONTROL",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.SET_SUPER_PRIVACY",
        "ohos.permission.PERMISSION_RECORD_TOGGLE",
        "ohos.permission.USE_SECURITY_PRIVACY_MESSAGER",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.PERMISSION_USED_STATS",
        "ohos.permission.ACCESS_SECURITY_PRIVACY_CENTER",
        "ohos.permission.START_SYSTEM_DIALOG",
        "ohos.permission.START_ABILITIES_FROM_BACKGROUND"
      ],
      "permission_acls": [
        "ohos.permission.MANAGE_DISPOSED_APP_STATUS",
        "ohos.permission.PERMISSION_RECORD_TOGGLE",
        "ohos.permission.USE_SECURITY_PRIVACY_MESSAGER",
        "ohos.permission.CAMERA_CONTROL",
        "ohos.permission.MICROPHONE_CONTROL",
        "ohos.permission.SET_SUPER_PRIVACY"
      ],
      "secon": "u:r:privacy_service:s0",
      "start-mode": "condition",
      "once": 1,
      "disabled": 1,
      "sandbox": 0,
      "saspawn": false
    },
    {
      "name": "huks_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/huks_service.json"
      ],
      "uid": "huks_server",
      "gid": [
        "huks_server"
      ],
      "apl": "system_basic",
      "bootevents": [
        "bootevent.huksService.ready"
      ],
      "permission": [
