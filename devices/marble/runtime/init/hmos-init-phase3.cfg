{
  "jobs": [
    {
      "name": "pre-init",
      "cmds": [
        "mkdir /data/service 0711 root root",
        "mkdir /data/chipset 0711 root root",
        "mkdir /data/app 0711 root root",
        "mkdir /data/misc 0711 root root",
        "mkdir /data/service/el0 0711 root root",
        "mkdir /data/service/el1 0711 root root",
        "mkdir /data/service/el2 0711 root root",
        "mkdir /data/service/el3 0711 root root",
        "mkdir /data/service/el4 0711 root root",
        "mkdir /data/service/el5 0711 root root",
        "mkdir /data/chipset/el1 0711 root root",
        "mkdir /data/chipset/el2 0711 root root",
        "mkdir /data/chipset/el3 0711 root root",
        "mkdir /data/chipset/el4 0711 root root",
        "mkdir /data/chipset/el5 0711 root root",
        "mkdir /data/app/el1 0711 root root",
        "mkdir /data/app/el2 0711 root root",
        "mkdir /data/app/el3 0711 root root",
        "mkdir /data/app/el4 0711 root root",
        "mkdir /data/app/el5 0711 root root",
        "mkdir /data/misc/el1 0711 root root",
        "mkdir /data/misc/el2 0711 root root",
        "mkdir /data/misc/el3 0711 root root",
        "mkdir /data/misc/el4 0711 root root",
        "mkdir /data/misc/el5 0711 root root",
        "setrlimit RLIMIT_NICE 40 40",
        "setrlimit RLIMIT_NOFILE 32768 32768",
        "write /dev/kmsg HMOS_BRIDGE_PRE_INIT",
        "mkdir /data/service/el0/access_token 0750 root access_token",
        "load_access_token_id ",
        "load_persist_params ",
        "setparam persist.bms.test-upgrade false",
        "mkdir /data/service/el0/public 0711 root root",
        "mkdir /data/service/el0/public/for-all-app 0711 root root",
        "mkdir /data/service/el0/public/for-all-app/hilog 0771 logd log",
        "mkdir /data/service/el1/public 0711 root root",
        "mkdir /data/log/ 0775 system log",
        "mkdir /data/log/dict/ 0755 logd log",
        "mkdir /data/log/hilog/ 0755 logd log",
        "write /proc/sys/net/unix/max_dgram_qlen 600",
        "start hilogd"
      ]
    },
    {
      "name": "init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_INIT",
        "symlink /proc/self/fd/0 /dev/stdin",
        "symlink /proc/self/fd/1 /dev/stdout",
        "symlink /proc/self/fd/2 /dev/stderr",
        "symlink /proc/self/fd /dev/fd",
        "mkdir /data/samgr 0740 samgr samgr"
      ]
    },
    {
      "name": "post-init",
      "cmds": [
        "write /dev/kmsg HMOS_BRIDGE_POST_INIT",
        "start samgr",
        "write /dev/kmsg HMOS_CORE_START_DONE"
      ]
    },
    {
      "name": "param:marble-start-hdf",
      "condition": "bootevent.samgr.ready=true",
      "cmds": [
        "write /dev/kmsg MARBLE_SAMGR_READY_STARTING_HDF",
        "start hdf_devmgr"
      ]
    },
    {
      "name": "param:marble-debug-coredeps",
      "condition": "marble.debug.start.coredeps=true",
      "cmds": [
        "write /dev/kmsg MARBLE_STARTING_COREDEPS",
        "mkdir /data/service/el1/public/access_token 0770 access_token access_token",
        "start param_watcher",
        "start concurrent_task_service",
        "start accesstoken_service",
        "start privacy_service"
      ]
    },
    {
      "name": "param:marble-debug-huks",
      "condition": "marble.debug.start.huks=true",
      "cmds": [
        "write /dev/kmsg MARBLE_STARTING_HUKS",
        "mkdir /data/service/el1/public/huks_service 0711 huks_server huks_server",
        "mkdir /data/service/el1/public/huks_service/maindata 0711 huks_server huks_server",
        "mkdir /data/service/el1/public/huks_service/bakdata 0711 huks_server huks_server",
        "mkdir /data/data/huks_service 0711 huks_server huks_server",
        "mkdir /data/data/huks_service/maindata 0711 huks_server huks_server",
        "start huks_service"
      ]
    },
    {
      "name": "param:marble-debug-account",
      "condition": "marble.debug.start.account=true",
      "cmds": [
        "write /dev/kmsg MARBLE_STARTING_ACCOUNTMGR",
        "mkdir /data/service/el1/public/account 0750 account account",
        "mkdir /data/service/el1/public/database 0711 ddms ddms",
        "mkdir /data/service/el1/public/database/os_account_mgr_service 02770 account ddms",
        "mkdir /data/service/el1/public/database/app_account_manager_service 02770 account ddms",
        "mkdir /data/service/el1/public/for-all-app/account 0755 account account",
        "start accountmgr"
      ]
    }
  ],
  "services": [
    {
      "name": "samgr",
      "path": [
        "/system/bin/samgr"
      ],
      "importance": -20,
      "uid": "samgr",
      "gid": [
        "samgr",
        "system",
        "readproc",
        "data_reserve"
      ],
      "file": [
        "/dev/kmsg rd 0660 root system"
      ],
      "bootevents": "bootevent.samgr.ready",
      "permission": [
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.ACCESS_SERVICE_DM",
        "ohos.permission.RECEIVER_STARTUP_COMPLETED",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS",
        "ohos.permission.LOCATION",
        "ohos.permission.APPROXIMATELY_LOCATION",
        "ohos.permission.GET_WIFI_INFO",
        "ohos.permission.USE_BLUETOOTH",
        "ohos.permission.DISCOVER_BLUETOOTH",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.LISTEN_BUNDLE_CHANGE",
        "ohos.permission.STORAGE_MANAGER",
        "ohos.permission.RECEIVE_SMS",
        "ohos.permission.GET_TELEPHONY_STATE",
        "ohos.permission.PUBLISH_SYSTEM_COMMON_EVENT",
        "ohos.permission.MONITOR_DEVICE_NETWORK_STATE",
        "ohos.permission.MANAGE_SYSTEM_ABILITY",
        "ohos.permission.START_RESTORE_NOTIFICATION",
        "ohos.permission.ACCESS_BLUETOOTH",
        "ohos.permission.USE_TRUSTED_RING",
        "ohos.permission.RECEIVE_UPDATE_MESSAGE"
      ],
      "permission_acls": [
        "ohos.permission.MONITOR_DEVICE_NETWORK_STATE",
        "ohos.permission.MANAGE_SYSTEM_ABILITY"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "secon": "u:r:samgr:s0",
      "start-mode": "condition"
    },
    {
      "name": "hilogd",
      "path": [
        "/system/bin/hilogd"
      ],
      "disabled": 1,
      "uid": "logd",
      "gid": [
        "log",
        "system",
        "readproc",
        "shell",
        "servicectrl"
      ],
      "sandbox": 0,
      "file": [
        "/dev/kmsg rd 0660 root system"
      ],
      "permission": [
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED"
      ],
      "socket": [
        {
          "name": "hilogInput",
          "family": "AF_UNIX",
          "type": "SOCK_DGRAM",
          "protocol": "default",
          "permissions": "0222",
          "uid": "logd",
          "gid": "log",
          "option": [
            "SOCKET_OPTION_PASSCRED"
          ]
        },
        {
          "name": "hilogOutput",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0666",
          "uid": "logd",
          "gid": "log",
          "option": [
            "SOCKET_OPTION_PASSCRED"
          ]
        },
        {
          "name": "hilogControl",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0660",
          "uid": "logd",
          "gid": "log",
          "option": []
        },
        {
          "name": "hilogControlPub",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0666",
          "uid": "logd",
          "gid": "log",
          "option": []
        }
      ],
      "start-mode": "condition",
      "secon": "u:r:hilogd:s0",
      "once": 1
    },
    {
      "name": "hdf_devmgr",
      "path": [
        "/system/bin/hdf_devmgr"
      ],
      "uid": "hdf_devmgr",
      "gid": [
        "hdf_devmgr",
        "readproc",
        "uhdf_driver",
        "data_reserve"
      ],
      "start-mode": "condition",
      "secon": "u:r:hdf_devmgr:s0",
      "bootevents": [
        "bootevent.hdf_devmgr.ready"
      ],
      "disabled": 1,
      "once": 1,
      "sandbox": 0
    },
    {
      "name": "param_watcher",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/param_watcher.json"
      ],
      "uid": "paramwatcher",
      "gid": [
        "paramwatcher",
        "shell"
      ],
      "start-mode": "condition",
      "saspawn": false,
      "secon": "u:r:param_watcher:s0",
      "bootevents": "bootevent.param_watcher.started",
      "disabled": 1,
      "once": 1,
      "sandbox": 0
    },
    {
      "name": "concurrent_task_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/concurrent_task_service.json"
      ],
      "importance": -20,
      "uid": "system",
      "gid": [
        "system",
        "shell"
      ],
      "bootevents": [
        "bootevent.concurrentTaskService.ready"
      ],
      "secon": "u:r:concurrent_task_service:s0",
      "permission": [
        "ohos.permission.REPORT_RESOURCE_SCHEDULE_EVENT",
        "ohos.permission.READ_HIVIEW_SYSTEM",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS"
      ],
      "disabled": 1,
      "once": 1,
      "start-mode": "condition",
      "sandbox": 0,
      "saspawn": false
    },
    {
      "name": "accesstoken_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/accesstoken_service.json"
      ],
      "importance": -20,
      "uid": "access_token",
      "gid": [
        "access_token",
        "data_reserve",
        "update",
        "app_install",
        "gameservice_server"
      ],
      "permission": [
        "ohos.permission.ACCESS_SERVICE_DM",
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.RUNNING_STATE_OBSERVER",
        "ohos.permission.GET_RUNNING_INFO",
        "ohos.permission.KILL_APP_PROCESSES",
        "ohos.permission.ACCESS_SECURITY_PRIVACY_CENTER",
        "ohos.permission.GET_PERMISSION_POLICY",
        "ohos.permission.securityguard.REPORT_SECURITY_INFO",
        "ohos.permission.GET_TICKET_INFO",
        "ohos.permission.QUERY_CLI_TOOL"
      ],
      "secon": "u:r:accesstoken_service:s0",
      "start-mode": "condition",
