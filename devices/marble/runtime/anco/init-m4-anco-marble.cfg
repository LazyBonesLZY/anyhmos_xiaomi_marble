      "gid": [
        "virt_device",
        "wifi",
        "wifi_group"
      ],
      "disabled": 1,
      "ondemand": true,
      "once": 0,
      "start-mode": "condition",
      "sandbox": 0,
      "saspawn": false,
      "apl": "normal",
      "secon": "u:r:ohos_anco_virtdevicebroker_service:s0",
      "permission": [
        "ohos.permission.ACCELEROMETER",
        "ohos.permission.GYROSCOPE",
        "ohos.permission.ACTIVITY_MOTION",
        "ohos.permission.READ_HEALTH_DATA",
