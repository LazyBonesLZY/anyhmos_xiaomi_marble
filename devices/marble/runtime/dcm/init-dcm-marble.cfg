{
  "jobs": [
    {
      "name": "post-fs-data",
      "cmds": [
        "mkdir /data/service/el1/public/device_cert_manager_server 0771 device_cert_manager_server device_cert_manager_server",
        "chown device_cert_manager_server device_cert_manager_server /data/service/el1/public/device_cert_manager_server",
        "chmod 0771 /data/service/el1/public/device_cert_manager_server"
      ]
    },
    {
      "name": "param:marble-u4-dcm",
      "condition": "marble.debug.start.u4_dcm=true",
      "cmds": [
        "mkdir /data/service/el1/public/device_cert_manager_server 0771 device_cert_manager_server device_cert_manager_server",
        "chown device_cert_manager_server device_cert_manager_server /data/service/el1/public/device_cert_manager_server",
        "chmod 0771 /data/service/el1/public/device_cert_manager_server",
        "start hmos_dcm_service"
      ]
    },
    {
      "name": "services:hmos_dcm",
      "cmds": [
        "mkdir /data/service/el1/public/device_cert_manager_server 0771 device_cert_manager_server device_cert_manager_server",
        "start hmos_dcm_service"
      ]
    }
  ],
  "services": [
    {
      "name": "hmos_dcm_service",
      "path": [
        "/compat/bin/hmos_dcm_service"
      ],
      "uid": "device_cert_manager_server",
      "gid": [
        "device_cert_manager_server",
        "shell",
        "netsys_socket"
      ],
      "apl": "system_basic",
      "secon": "u:r:dcm_service:s0",
      "sandbox": 0,
      "disabled": 1,
      "once": 1,
      "start-mode": "condition",
      "permission": [
        "ohos.permission.REPORT_SECURITY_EVENT",
        "ohos.permission.sec.ACCESS_UDID",
        "ohos.permission.GET_TELEPHONY_STATE",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.hsdr.REQUEST_HSDR",
        "ohos.permission.GET_NETWORK_INFO",
        "ohos.permission.INTERACT_ACROSS_LOCAL_ACCOUNTS"
      ]
    }
  ]
}
