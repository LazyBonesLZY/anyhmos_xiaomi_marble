{
  "jobs": [
    {
      "name": "param:marble-usb-port-ready",
      "condition": "marble.usb_port.ready=true",
      "cmds": [
        "start usb_host"
      ]
    }
  ],
  "services": [
    {
      "name": "usb_host",
      "path": [
        "/vendor/bin/hdf_devhost",
        "-i",
        "13",
        "-n",
        "usb_host"
      ],
      "uid": "usb_host",
      "gid": [
        "usb_host",
        "system"
      ],
      "caps": [
        "DAC_OVERRIDE",
        "DAC_READ_SEARCH"
      ],
      "secon": "u:r:usb_host:s0",
      "disabled": 1,
      "once": 1,
      "sandbox": 0,
      "start-mode": "condition"
    }
  ]
}
