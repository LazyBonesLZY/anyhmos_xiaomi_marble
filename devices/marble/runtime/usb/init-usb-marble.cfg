{
  "jobs": [
    {
      "name": "services:hdcd",
      "cmds": [
        "mkdir /data/service/el1/public/hdc 0775 root shell",
        "mkdir /data/service/el2/public/hdc_service 0700 root root",
        "restorecon /data/service/el1/public/hdc",
        "mkdir /dev/usb-ffs 0775 shell shell",
        "mkdir /dev/usb-ffs/hdc 0770 shell shell"
      ]
    },
    {
      "name": "services:usb_service",
      "cmds": [
        "mkdir /data/service/el1/public/usb_service 0770 usb usb",
        "mkdir /data/service/el1/public/usb_service/right 0770 usb usb"
      ]
    },
    {
      "name": "param:marble-usb",
      "condition": "marble.debug.start.usb=true",
      "cmds": [
        "setparam persist.hdc.mode.usb enable",
        "setparam persist.hdc.mode.tcp disable",
        "setparam persist.hdc.mode.uart disable",
        "setparam persist.hdc.root 0",
        "setparam persist.hdc.control.shell false",
        "setparam persist.hdc.control.fport false",
        "setparam persist.hdc.control.file true",
        "start hdcd"
      ]
    },
    {
      "name": "param:marble-usb-service",
      "condition": "marble.debug.start.usb_service=true",
      "cmds": [
        "start usb_service"
      ]
    }
  ],
  "services": [
    {
      "name": "hdcd",
      "path": [
        "/system/bin/hdcd"
      ],
      "uid": "shell",
      "gid": [
        "shell",
        "log",
        "readproc",
        "file_manager",
        "netsys_socket"
      ],
      "socket": [
        {
          "name": "hdcd",
          "family": "AF_UNIX",
          "type": "SOCK_SEQPACKET",
          "protocol": "default",
          "permissions": "0660",
          "uid": "shell",
          "gid": "shell"
        }
      ],
      "apl": "normal",
      "sandbox": 0,
      "start-mode": "condition",
      "secon": "u:r:hdcd:s0",
      "disabled": 1,
      "jobs": {
        "on-start": "services:hdcd"
      }
    },
    {
      "name": "mtpfs",
      "path": [
        "/system/bin/mtpfs"
      ],
      "uid": "mtp",
      "gid": [
        "mtp",
        "shell",
        "media_rw"
      ],
      "apl": "normal",
      "sandbox": 0,
      "start-mode": "condition",
      "secon": "u:r:mtpfs:s0",
      "disabled": 1
    },
    {
      "name": "usb_service",
      "path": [
        "/system/bin/sa_main",
        "/system/profile/usb_service.json"
      ],
      "ondemand": true,
      "condition": "bootevent.wms.fullscreen.ready=true",
      "uid": "usb",
      "gid": [
        "usb",
        "shell",
        "usb_host"
      ],
      "permission": [
        "ohos.permission.COMMONEVENT_STICKY",
        "ohos.permission.LISTEN_BUNDLE_CHANGE",
        "ohos.permission.DISTRIBUTED_DATASYNC",
        "ohos.permission.ENTERPRISE_MANAGE_USB",
        "ohos.permission.GET_BUNDLE_INFO_PRIVILEGED",
        "ohos.permission.GET_BUNDLE_RESOURCES",
        "ohos.permission.MANAGE_LOCAL_ACCOUNTS",
        "ohos.permission.MANAGE_SECURE_SETTINGS",
        "ohos.permission.MANAGE_SETTINGS",
        "ohos.permission.securityguard.REPORT_SECURITY_INFO",
        "ohos.permission.START_ABILITIES_FROM_BACKGROUND",
        "ohos.permission.START_SYSTEM_DIALOG"
      ],
      "apl": "system_basic",
      "secon": "u:r:usb_service:s0",
      "disabled": 1,
      "jobs": {
        "on-start": "services:usb_service"
      }
    }
  ]
}